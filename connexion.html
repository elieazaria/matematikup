<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Connexion — MATEMATIKUP</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = { theme: { extend: { colors: {
      primary:   { DEFAULT: '#3730A3', dark: '#272275', light: '#4F46E5' },
      secondary: { DEFAULT: '#FF5A36', dark: '#E04824', light: '#FF7A5C' },
      accent:    { DEFAULT: '#2FD9A8', dark: '#24AE86', light: '#55E3BA' },
    } } } };
  </script>
  <style>
    body { font-family: 'Nunito Sans', sans-serif; background: #fff; color: #272275; }
    h1, h2, button, label { font-family: 'Nunito', sans-serif; }
    .field {
      width: 100%; border: 2px solid rgba(55,48,163,.15); border-radius: 12px; background: #fff;
      padding: 12px 14px; font-size: .95rem; font-weight: 600; color: #272275; transition: border-color .2s, box-shadow .2s;
    }
    .field::placeholder { color: rgba(39,34,117,.35); font-weight: 400; }
    .field:focus { outline: none; border-color: #3730A3; box-shadow: 0 0 0 4px rgba(55,48,163,.12); }
    .field.invalid { border-color: #FF5A36; }
    .err { color: #E04824; font-size: .78rem; font-weight: 700; margin-top: 4px; display: none; }
    .err.show { display: block; }
  </style>
</head>
<body class="min-h-screen relative overflow-x-hidden">

  <div aria-hidden="true" class="pointer-events-none absolute inset-0 overflow-hidden">
    <div class="absolute -top-32 -left-32 w-[520px] h-[520px] rounded-full opacity-70" style="background:radial-gradient(circle,#EEF0FF,transparent 70%);"></div>
    <div class="absolute bottom-0 -right-32 w-[560px] h-[560px] rounded-full opacity-70" style="background:radial-gradient(circle,#EEF0FF,transparent 70%);"></div>
  </div>

  <header class="relative z-10 flex items-center justify-between px-5 md:px-10 lg:px-16 py-4">
  <a href="index.html" aria-label="MATEMATIKUP — Accueil"><img src="logo_mate.jpeg" alt="MATEMATIKUP" class="h-10 w-auto" /></a>
  <a href="index.html" class="inline-flex items-center gap-1.5 text-sm font-bold text-primary hover:text-secondary transition-colors">
    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor" class="w-4 h-4">
      <path stroke-linecap="round" stroke-linejoin="round" d="m2.25 12 8.954-8.955c.44-.439 1.152-.439 1.591 0L21.75 12M4.5 9.75v10.125c0 .621.504 1.125 1.125 1.125H9.75v-4.875c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125V21h4.125c.621 0 1.125-.504 1.125-1.125V9.75M8.25 21h8.25" />
    </svg>
    Retour à l'accueil
  </a>
</header>

  <main class="relative z-10 flex justify-center px-5 pt-8 pb-16">
    <section class="w-full max-w-md bg-white border border-primary/10 rounded-3xl shadow-2xl shadow-primary/10 p-7 sm:p-10">

      <div class="text-center mb-7">
        <h1 class="font-black text-3xl text-primary-dark mb-2">Content de <span class="text-secondary">te revoir</span> 👋</h1>
        <p class="text-primary-dark/60 text-sm">Connecte-toi pour reprendre là où tu t'es arrêté.</p>
      </div>

      <button type="button" id="google-btn"
              class="w-full flex items-center justify-center gap-3 border-2 border-primary/15 rounded-xl py-3 font-black text-sm text-primary-dark hover:border-primary hover:bg-primary/5 transition-colors">
        <svg class="w-5 h-5" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.600-.4-3.900z"/><path fill="#FF3D00" d="M6.300 14.700l6.600 4.800C14.700 15.100 19 12 24 12c3.100 0 5.800 1.200 8 3l5.700-5.700C34 6.100 29.300 4 24 4 16.300 4 9.700 8.300 6.300 14.700z"/><path fill="#4CAF50" d="M24 44c5.200 0 9.900-2 13.400-5.200l-6.200-5.200C29.200 35.100 26.700 36 24 36c-5.200 0-9.600-3.300-11.300-7.900l-6.500 5C9.500 39.600 16.200 44 24 44z"/><path fill="#1976D2" d="M43.600 20.100H42V20H24v8h11.300c-.8 2.200-2.200 4.100-4.100 5.600l6.200 5.200C37 39.200 44 34 44 24c0-1.300-.1-2.600-.4-3.900z"/></svg>
        Continuer avec Google
      </button>

      <div class="flex items-center gap-4 my-6">
        <div class="flex-1 h-px bg-primary/10"></div>
        <span class="text-xs font-bold text-primary-dark/40 uppercase tracking-widest">ou</span>
        <div class="flex-1 h-px bg-primary/10"></div>
      </div>

      <form id="login-form" novalidate class="space-y-5">
        <div>
          <label for="identifier" class="block text-sm font-black mb-1.5">Adresse e-mail ou numéro mobile</label>
          <input id="identifier" name="identifier" type="text" autocomplete="username" required class="field" placeholder="nom@exemple.com ou 034 00 000 00" />
          <p class="err" data-for="identifier">Saisis une adresse e-mail ou un numéro mobile valide.</p>
        </div>

        <div>
          <div class="flex items-center justify-between mb-1.5">
            <label for="password" class="block text-sm font-black">Mot de passe</label>
            <a href="#" class="text-xs font-black text-primary hover:text-secondary transition-colors">Mot de passe oublié ?</a>
          </div>
          <div class="relative">
            <input id="password" name="password" type="password" autocomplete="current-password" required class="field pr-12" placeholder="Ton mot de passe" />
            <button type="button" id="toggle-pw" class="absolute right-3 top-1/2 -translate-y-1/2 text-primary/60 hover:text-primary text-xs font-black">Afficher</button>
          </div>
          <p class="err" data-for="password">Saisis ton mot de passe.</p>
        </div>

        <button type="submit"
                class="w-full bg-secondary hover:bg-secondary-dark text-white font-black py-3.5 rounded-xl shadow-lg shadow-secondary/25 hover:scale-[1.01] active:scale-[.98] transition-all">
          Se connecter
        </button>
        <p id="form-ok" class="hidden text-center text-accent-dark font-black text-sm">✓ Formulaire valide — à brancher sur ton back-end.</p>
      </form>

      <p class="text-center text-sm text-primary-dark/60 mt-7">
        Pas encore de compte ? <a href="inscription.html" class="font-black text-primary hover:text-secondary transition-colors">S'inscrire</a>
      </p>
    </section>
  </main>

  <script>
    const $ = id => document.getElementById(id);
    const isEmail = v => /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v);
    const isPhone = v => /^\+?[0-9\s.-]{9,15}$/.test(v);

    const rules = {
      identifier: v => isEmail(v.trim()) || isPhone(v.trim()),
      password:   v => v.length > 0,
    };
    function check(id) {
      const ok = rules[id]($(id).value);
      $(id).classList.toggle('invalid', !ok);
      document.querySelector('.err[data-for="' + id + '"]').classList.toggle('show', !ok);
      return ok;
    }
    Object.keys(rules).forEach(id => $(id).addEventListener('blur', () => check(id)));

    $('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const allOk = Object.keys(rules).map(check).every(Boolean);
      $('form-ok').classList.toggle('hidden', !allOk);
      if (allOk) {
        const id = $('identifier').value.trim();
        // TODO : envoyer à ton API de connexion
        console.log('Connexion', { type: isEmail(id) ? 'email' : 'mobile', identifier: id });
      }
    });

    $('toggle-pw').addEventListener('click', () => {
      const show = $('password').type === 'password';
      $('password').type = show ? 'text' : 'password';
      $('toggle-pw').textContent = show ? 'Masquer' : 'Afficher';
    });

    $('google-btn').addEventListener('click', () => {
      // TODO : brancher Google Identity Services / OAuth
      alert('Connexion Google à brancher.');
    });
  </script>
</body>
</html>
